repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^node_modules/|
            /node_modules/|
            ^schedule/node_modules/|
            ^schedule/public/|
            ^beveren_fsm/public/|
            ^public/|
            ^docs/screenshots/|
            ^.*\.(png|jpg|jpeg|gif|svg|webp|ico|pdf|mp4|mov|zip|tar|gz|lock)$
          )
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^node_modules/|
            /node_modules/|
            ^schedule/node_modules/|
            ^schedule/public/|
            ^beveren_fsm/public/|
            ^public/|
            ^docs/screenshots/|
            ^.*\.(png|jpg|jpeg|gif|svg|webp|ico|pdf|mp4|mov|zip|tar|gz|lock)$
          )
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
        exclude: |
          (?x)(
            ^schedule/tsconfig.*\.json$|
            ^schedule/.*\.tsconfig\.json$|
            ^.*\.tsconfig\.json$
          )
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]
        additional_dependencies: ["tomli"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
      - id: ruff
        name: "Run ruff linter"
      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        exclude: |
          (?x)(
            ^schedule/public/|
            ^beveren_fsm/public/|
            ^node_modules/|
            /node_modules/|
            ^dist/|
            ^.*\.(html|jinja|min\.js)$
          )

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        name: eslint (schedule/src)
        files: ^schedule/src/.*\.(ts|tsx|js|jsx)$
        args: ['--quiet']
        exclude: |
          (?x)(
            ^schedule/public/|
            ^beveren_fsm/public/|
            ^node_modules/|
            /node_modules/|
            ^dist/|
            ^assets/
          )

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false
