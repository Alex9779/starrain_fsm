<div class="dispatch-page">
	<!-- Top Navbar -->
	<nav class="dispatch-navbar">
		<div class="nav-left">
			<button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
				<i class="fa fa-angle-double-left"></i>
			</button>
		</div>
		<div class="nav-right">
			<ul class="nav-view-list">
				<li><button class="nav-view-btn active" id="btn-gantt">Gantt</button></li>
				<li><button class="nav-view-btn" id="btn-calendar">Calendar</button></li>
				<li><button class="nav-view-btn" id="btn-map">Map</button></li>
			</ul>
		</div>
	</nav>

	<div class="dispatch-body">
		<!-- Sidebar -->
		<aside class="dispatch-sidebar" id="dispatch-sidebar">
			<div class="sidebar-header">
				<div class="sidebar-heading-group">
					<strong class="sidebar-heading" id="sidebar-selected-mode">Service Order</strong>
					<i class="fa fa-caret-down sidebar-caret" id="sidebar-dropdown-toggle"></i>
				</div>
				<div class="sidebar-icons" id="sidebar-header-icons">
					<!-- Always show Add icon now -->
					<button class="sidebar-icon" id="sidebar-add-icon" title="Add New">
						<i class="fa fa-plus"></i>
					</button>

					<button class="sidebar-icon" id="sidebar-search-toggle" title="Search">
						<i class="fa fa-search"></i>
					</button>
					<button class="sidebar-icon" id="sidebar-refresh" title="Refresh">
						<i class="fa fa-refresh"></i>
					</button>
				</div>
			</div>

			<div class="sidebar-dropdown" id="sidebar-dropdown">
				<div class="sidebar-dropdown-tabs">
					<span class="dropdown-tab active" data-mode="Service Order">Service Order</span>
					<span class="dropdown-tab" data-mode="Service Appointment">Service Appointment</span>
				</div>
				<div class="sidebar-dropdown-search">
					<input type="text" id="dropdown-search-input" placeholder="Search..." />
				</div>
				<div class="sidebar-dropdown-list" id="dropdown-list"></div>
			</div>

			<div class="sidebar-inline-search" id="sidebar-inline-search">
				<input type="text" placeholder="Search Service Orders..." id="sidebar-search-input" />
			</div>

			<ul id="sidebar-list" class="sidebar-list">
				<!-- Populated by JS -->
			</ul>
		</aside>

		<!-- Main Content -->
		<main class="dispatch-content">
			<div id="view-content" class="dispatch-view-content">
				<div class="placeholder-content">
					<h3>Welcome to Dispatch</h3>
					<p>Select a view (Gantt, Calendar, or Map) to get started.</p>
				</div>
			</div>
		</main>
	</div>

	<!-- Right-click tooltip container -->
	<div id="sidebar-tooltip" class="sidebar-tooltip"></div>
</div>
